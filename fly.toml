app = "baguettepad"          # must be unique on Fly; change if taken
primary_region = "iad"

[build.args]
VITE_CLUSTER = "mainnet-beta"
VITE_DBC_CONFIG = "BdNWsCHtBwyJz8J7MjM62M5EhDdn5uM4CKxTf5eFGFY8"
VITE_FEE_CLAIMER = "9yjvPVhA8JM3KCaHduVtawW7xnvkXWuLJEMAnkSvpN8r"
VITE_MAX_DEV_BUY_SOL = "1"
# VITE_RPC_URL = "https://your-paid-rpc"   # browser-side RPC key (public by nature)

[env]
PORT = "8080"
DATA_DIR = "/data"
SOLANA_CLUSTER = "mainnet-beta"
MARKET_MODE = "live"
PUBLIC_BASE_URL = "https://baguettepad.xyz"
TRUST_PROXY = "1"
HSTS = "1"

[mounts]
source = "baguettepad_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"     # keep running: the cat posts and coin data need it
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
