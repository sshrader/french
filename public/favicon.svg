<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Bonkeparte logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="1" stop-color="#070d1c"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a66"/>
      <stop offset="1" stop-color="#0f1a38"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- tricolour band across the bottom -->
  <rect x="180" y="800" width="221" height="40" fill="#1d4ed8"/>
  <rect x="401" y="800" width="222" height="40" fill="#ffffff"/>
  <rect x="623" y="800" width="221" height="40" fill="#ef4135"/>
  <!-- bicorne hat, worn sideways -->
  <path d="M110 640 C200 330 360 230 512 230 C664 230 824 330 914 640 C780 540 650 500 512 500 C374 500 244 540 110 640 Z" fill="url(#hat)" stroke="#8fa3d4" stroke-width="10"/>
  <path d="M170 690 C260 610 380 570 512 570 C644 570 764 610 854 690 C770 770 650 810 512 810 C374 810 254 770 170 690 Z" fill="#0f1a38" stroke="#8fa3d4" stroke-width="10"/>
  <!-- cockade -->
  <circle cx="512" cy="400" r="86" fill="#1d4ed8"/>
  <circle cx="512" cy="400" r="62" fill="#ffffff"/>
  <circle cx="512" cy="400" r="34" fill="#ef4135"/>
  <!-- a coin on the brim -->
  <circle cx="512" cy="690" r="64" fill="#fbbf24" stroke="#b45309" stroke-width="10"/>
  <path d="M512 650 L520 676 L548 678 L526 695 L534 722 L512 706 L490 722 L498 695 L476 678 L504 676 Z" fill="#b45309"/>
</svg>
