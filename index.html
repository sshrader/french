<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaguettePad – Fresh memecoin launches, baked daily.</title>
    <meta name="description" content="BaguettePad: the Solana launchpad with a French Revolution attitude. Launch a coin and a French hero or meme becomes its AI champion: it writes the lore, chats with holders and bonks the cartoon mob off the barricades with a baguette." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="BaguettePad – Fresh memecoin launches" />
    <meta property="og:description" content="Launch a coin on Solana and get a French hero or meme as its AI champion, holding the barricades baguette-first." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#14224a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Some Solana packages read Node's `process` and `global`. Define them before any module runs.
      window.global = window.global || window;
      window.process = window.process || {
        env: {},
        browser: true,
        version: '',
        versions: {},
        nextTick: function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { fn.apply(null, args); });
        },
      };
    </script>
    <!-- If the app crashes while loading, show the error instead of a blank page. -->
    <script>
      function showCrash(msg) {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<pre style="padding:16px;margin:0;white-space:pre-wrap;font:13px monospace;color:#c00">App failed to start:\n' +
            String(msg).replace(/</g, '&lt;') + '\n\nOpen the browser console (F12) for details.</pre>';
        }
      }
      window.addEventListener('error', function (e) { showCrash(e.message || 'unknown error'); });
      window.addEventListener('unhandledrejection', function (e) { showCrash(e.reason && e.reason.message || e.reason); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
